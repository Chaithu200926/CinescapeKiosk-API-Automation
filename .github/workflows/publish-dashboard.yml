name: Publish test dashboard

# Tests run on the QA PC (the kiosk API is on the office network) via `npm run publish-results`,
# which commits the results to reports/. This workflow runs on GitHub's servers: it shows the
# results on the run page, deploys reports/ to GitHub Pages, and goes red if any test failed.
on:
  push:
    branches: [main]
    paths: ['reports/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show test results on this run
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Fail the run if any test failed
        run: |
          failed=$(jq '.stats.unexpected // 0' reports/results.json)
          echo "Failed tests: $failed"
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed test(s) failed. See the dashboard or the summary above."
            exit 1
          fi
